services:
  dagu:
    build:
      context: ../..
      dockerfile: scripts/update/Dockerfile.dagu
    image: echo-noise-update:u6-1
    network_mode: host
    pid: host
    cap_add: [SYS_PTRACE]
    restart: always
    environment:
      DAGU_HOME: /var/lib/dagu
      DAGU_HOST: 127.0.0.1
      DAGU_PORT: 8324
      DAGU_AUTH_MODE: builtin
    volumes:
      # Retain the existing Dagu data/identity; do not replace it with an empty volume.
      - /srv/dagu:/var/lib/dagu
      - /var/run/docker.sock:/var/run/docker.sock
      # All paths below use the SAME absolute host path inside this container.
      - /var/lib/echo-noise-update:/var/lib/echo-noise-update
      - /var/lib/docker:/var/lib/docker:ro
      - /srv/echo-noise/config:/srv/echo-noise/config:ro
      - /srv/echo-noise/data:/srv/echo-noise/data:ro
