name: Test external update executor

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update/**'
      - 'scripts/release/**'
      - 'internal/updates/**'
      - 'internal/backup/**'
      - 'internal/syncmanager/**'
      - 'internal/routers/routers.go'
      - 'cmd/update-tool/**'
      - 'cmd/server/**'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'internal/controllers/update_task_controller.go'
      - 'internal/middleware/auth.go'
      - 'internal/models/update.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/update-executor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Recovery and protocol checks
        run: |
          sh scripts/release/test-release-policy.sh
          python3 -m unittest discover -s scripts/update -p 'test_*.py' -v
          go test ./internal/updates ./internal/controllers ./internal/middleware ./internal/routers -run 'Update|Executor|Task|Overview|Rotated' -count=1 -timeout=8m
          go test ./internal/backup ./internal/syncmanager -count=1 -timeout=8m
      - name: Compile two isolated coordinator builds
        env:
          CGO_ENABLED: '0'
        run: |
          for i in 1 2; do
            revision=$(printf '%040d' 0 | tr 0 "$i")
            go build -ldflags "-X github.com/rcy1314/echo-noise/internal/buildinfo.Revision=$revision" -o "coordinator-$i" ./scripts/update/fixture
          done
          go build -o update-tool ./cmd/update-tool
      - name: Real registry and Docker/Compose replacement
        run: sudo -E python3 scripts/update/test-docker.py
      - name: Three revisions and real channel publication
        env:
          CGO_ENABLED: '0'
        run: |
          work="$(mktemp -d)"
          mkdir "$work/git"
          git -C "$work/git" init -q -b main
          git -C "$work/git" config user.name U7
          git -C "$work/git" config user.email u7@example.invalid
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          revisions=()
          for name in A B C; do
            echo "$name" > "$work/git/source"
            git -C "$work/git" add source
            git -C "$work/git" commit -qm "$name"
            revision="$(git -C "$work/git" rev-parse HEAD)"
            revisions+=("$revision")
            version="${revision:0:12}"
            if [[ "$name" == A ]]; then version=v1.0.0; fi
            if [[ "$name" == C ]]; then version=v1.1.0; fi
            go build -ldflags "-X github.com/rcy1314/echo-noise/internal/buildinfo.Revision=$revision -X github.com/rcy1314/echo-noise/internal/buildinfo.Version=$version -X github.com/rcy1314/echo-noise/internal/buildinfo.Identity=$version -X github.com/rcy1314/echo-noise/internal/buildinfo.BuiltAt=$built_at" -o "$work/coordinator-$name" ./scripts/update/fixture
          done
          git -C "$work/git" tag -a v1.0.0 "${revisions[0]}" -m A
          git -C "$work/git" tag -a v1.1.0 "${revisions[2]}" -m C
          rebuilt_at="$(date -u -d "$built_at + 1 second" +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags "-X github.com/rcy1314/echo-noise/internal/buildinfo.Revision=${revisions[2]} -X github.com/rcy1314/echo-noise/internal/buildinfo.Version=v1.1.0 -X github.com/rcy1314/echo-noise/internal/buildinfo.Identity=v1.1.0 -X github.com/rcy1314/echo-noise/internal/buildinfo.BuiltAt=$rebuilt_at" -o "$work/coordinator-D" ./scripts/update/fixture
          printf '%s' "$built_at" > "$work/built-at"
          printf '%s' "$rebuilt_at" > "$work/rebuilt-at"
          printf '["%s","%s","%s"]' "${revisions[@]}" > "$work/revisions.json"
          sudo chown -R root:root "$work"
          sudo -E env U7_CHANNEL_FIXTURES="$work" python3 scripts/update/test-channels.py
          sudo rm -rf "$work"
