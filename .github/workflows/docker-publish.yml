name: Build MCP Docker Image

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms: amd64 for testing; select both for multi-platform releases'
        required: true
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
      formal_version:
        description: 'Formal release version (for example v4.0.6); leave empty to use short SHA'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mcp-image:
    name: Build and publish final-mcp image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image metadata
        id: meta
        shell: bash
        env:
          FORMAL_VERSION: ${{ inputs.formal_version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/echo-noise"
          short_sha="${GITHUB_SHA::12}"
          raw_version="$FORMAL_VERSION"
          if [ -n "$raw_version" ]; then
            version="$(echo "$raw_version" | sed -E 's/^[vV][[:space:]]*//')"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: formal_version must use vX.Y.Z or X.Y.Z"
              exit 1
            fi
            version="v${version}"
          else
            version="$short_sha"
          fi

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:latest-mcp"
            echo "${image}:sha-${short_sha}-mcp"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU binfmt
        if: contains(inputs.platforms, 'arm64')
        shell: bash
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Set up Docker Buildx
        shell: bash
        run: |
          docker buildx create --name echo-noise-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push final-mcp image
        shell: bash
        env:
          TARGET_PLATFORMS: ${{ inputs.platforms }}
        run: |
          tags=(
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/echo-noise:latest-mcp"
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/echo-noise:sha-${{ steps.meta.outputs.short_sha }}-mcp"
          )
          version="${{ steps.meta.outputs.version }}"
          if [[ "$version" == v* ]]; then
            tags+=(--tag "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/echo-noise:${version}-mcp")
          fi
          docker buildx build \
            --platform "$TARGET_PLATFORMS" \
            --target final-mcp \
            --build-arg VERSION=${{ steps.meta.outputs.version }} \
            "${tags[@]}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            .
