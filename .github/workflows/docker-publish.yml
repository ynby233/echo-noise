name: Build MCP Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to rebuild
        required: true
        type: choice
        default: edge
        options:
          - edge
          - stable
      release_tag:
        description: Existing published vX.Y.Z Release tag; required for stable
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.event_name == 'release' && 'stable' || (github.event_name == 'workflow_dispatch' && inputs.channel || 'edge') }}
  queue: max
  cancel-in-progress: false

jobs:
  build-mcp-image:
    name: Build and publish final-mcp image
    if: github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/ynby233/echo-noise
      EDGE_TAG: edge-mcp
      STABLE_TAG: stable-mcp

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve channel target
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin main

          channel=edge
          release_tag=
          case "$GITHUB_EVENT_NAME" in
            release)
              channel=stable
              release_tag="$EVENT_RELEASE_TAG"
              ;;
            workflow_dispatch)
              channel="${DISPATCH_CHANNEL:-edge}"
              release_tag="$DISPATCH_RELEASE_TAG"
              ;;
          esac

          if [[ "$channel" == stable ]]; then
            if [[ -z "$release_tag" ]]; then
              echo "ERROR: stable rebuilds require an existing published Release tag"
              exit 1
            fi
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}")"
              if [[ "$(jq -r '.draft or .prerelease' <<<"$release")" != false || "$(jq -r '.published_at // empty' <<<"$release")" == '' ]]; then
                echo "ERROR: stable target must be a published, non-prerelease Release"
                exit 1
              fi
            fi
            resolved="$(sh scripts/release/resolve-release.sh "$release_tag" origin/main)"
            version="$(awk -F= '$1 == "VERSION" { print $2 }' <<<"$resolved")"
            revision="$(awk -F= '$1 == "REVISION" { print $2 }' <<<"$resolved")"
          else
            revision="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
            if ! git merge-base --is-ancestor "$revision" origin/main; then
              echo "ERROR: edge target must belong to main"
              exit 1
            fi
            version="${revision:0:12}"
          fi

          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "channel=$channel"
            if [[ "$channel" == stable ]]; then
              echo "channel_tag=$STABLE_TAG"
            else
              echo "channel_tag=$EDGE_TAG"
            fi
            echo "candidate_tag=build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-mcp"
            echo "revision=$revision"
            echo "short_sha=${revision:0:12}"
            echo "version=$version"
            echo "build_time=$build_time"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact target source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.revision }}
          path: source

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: source
          target: final-mcp
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.candidate_tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.meta.outputs.revision }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            index:org.opencontainers.image.created=${{ steps.meta.outputs.build_time }}
            index:org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test candidate
        shell: bash
        env:
          CANDIDATE: ${{ env.IMAGE }}:${{ steps.meta.outputs.candidate_tag }}
          EXPECTED_REVISION: ${{ steps.meta.outputs.revision }}
        run: |
          set -euo pipefail
          name="echo-noise-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker pull "$CANDIDATE"
          test "$(docker image inspect "$CANDIDATE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$EXPECTED_REVISION"
          docker run -d --name "$name" -e ACCESS_LOG=false "$CANDIDATE"
          for _ in $(seq 1 60); do
            status="$(docker inspect "$name" --format '{{.State.Health.Status}}')"
            [[ "$status" == healthy ]] && exit 0
            [[ "$status" == unhealthy ]] && break
            sleep 2
          done
          docker logs "$name"
          exit 1

      - name: Publish immutable target
        id: target
        shell: bash
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          CANDIDATE: ${{ env.IMAGE }}:${{ steps.meta.outputs.candidate_tag }}
          REVISION: ${{ steps.meta.outputs.revision }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILT_AT: ${{ steps.meta.outputs.build_time }}
        run: |
          set -euo pipefail
          publish_tag() {
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --annotation "index:org.opencontainers.image.revision=${REVISION}" \
              --annotation "index:org.opencontainers.image.created=${BUILT_AT}" \
              --annotation "index:org.opencontainers.image.version=${VERSION}" \
              --tag "$1" "$2"
          }

          if [[ "$CHANNEL" == stable ]]; then
            target="${IMAGE}:${VERSION}-mcp"
            metadata="$(sh scripts/release/image-metadata.sh "$target")"
            state="$(awk -F= '$1 == "STATE" { print $2 }' <<<"$metadata")"
            existing_revision="$(awk -F= '$1 == "REVISION" { print $2 }' <<<"$metadata")"
            existing_version="$(awk -F= '$1 == "VERSION" { print $2 }' <<<"$metadata")"
            if [[ "$state" == exists ]]; then
              if [[ "$existing_revision" != "$REVISION" || "$existing_version" != "$VERSION" ]]; then
                echo "ERROR: formal tag already exists with different content"
                exit 1
              fi
            else
              publish_tag "$target" "$CANDIDATE"
            fi
          else
            target="${IMAGE}:sha-${REVISION}-mcp"
            metadata="$(sh scripts/release/image-metadata.sh "$target")"
            state="$(awk -F= '$1 == "STATE" { print $2 }' <<<"$metadata")"
            existing_revision="$(awk -F= '$1 == "REVISION" { print $2 }' <<<"$metadata")"
            existing_version="$(awk -F= '$1 == "VERSION" { print $2 }' <<<"$metadata")"
            if [[ "$state" == exists && ( "$existing_revision" != "$REVISION" || "$existing_version" != "$VERSION" ) ]]; then
              echo "ERROR: commit tag already exists with different content"
              exit 1
            elif [[ "$state" == missing ]]; then
              publish_tag "$target" "$CANDIDATE"
            fi
          fi
          echo "ref=$target" >> "$GITHUB_OUTPUT"

      - name: Move channel tag
        shell: bash
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          CHANNEL_REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.channel_tag }}
          TARGET_REF: ${{ steps.target.outputs.ref }}
          TARGET_REVISION: ${{ steps.meta.outputs.revision }}
          TARGET_VERSION: ${{ steps.meta.outputs.version }}
          BUILT_AT: ${{ steps.meta.outputs.build_time }}
        run: |
          set -euo pipefail
          metadata="$(sh scripts/release/image-metadata.sh "$CHANNEL_REF")"
          state="$(awk -F= '$1 == "STATE" { print $2 }' <<<"$metadata")"
          current_revision="$(awk -F= '$1 == "REVISION" { print $2 }' <<<"$metadata")"
          current_version="$(awk -F= '$1 == "VERSION" { print $2 }' <<<"$metadata")"
          if [[ "$state" == exists && ( -z "$current_revision" || -z "$current_version" ) ]]; then
            echo "ERROR: existing channel is missing release metadata"
            exit 1
          fi
          if [[ "$CHANNEL" == stable && "$state" == exists && ! "$current_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: existing stable channel is missing a formal version"
            exit 1
          fi
          policy="$(sh scripts/release/channel-policy.sh "$current_revision" "$TARGET_REVISION" "$current_version" "$TARGET_VERSION")"
          if [[ "$policy" == keep ]]; then
            echo "Channel already points to the same or a newer target; leaving it unchanged."
            exit 0
          fi
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.revision=${TARGET_REVISION}" \
            --annotation "index:org.opencontainers.image.created=${BUILT_AT}" \
            --annotation "index:org.opencontainers.image.version=${TARGET_VERSION}" \
            --tag "$CHANNEL_REF" "$TARGET_REF"
