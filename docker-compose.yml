# Local source development: one application image with an optional MCP module.
# Prebuilt final-mcp deployments use scripts/update/compose.example.yml instead.
services:
  my-app:
    build:
      context: .
      dockerfile: Dockerfile
      # 默认打包 MCP；设置 APP_BUILD_TARGET=final 可选择不含 MCP 的镜像。
      target: ${APP_BUILD_TARGET:-final-mcp}
    container_name: Ech0-Noise
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Web Push 私钥建议以只读文件挂载，并在环境变量中填写同一路径。
      #- ./secrets/echo-noise-vapid-private-key:/run/secrets/echo-noise-vapid-private-key:ro
    environment:
      - LOG_LEVEL=info
      - ACCESS_LOG=false
      - DB_TYPE=sqlite
      - DB_PATH=/app/data/noise.db
      - HTTP_PORT=1314
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - MCP_TRANSPORT=${MCP_TRANSPORT:-stdio}
      - NOTE_HOST=http://127.0.0.1:1314
      # stdio 由客户端 docker exec 按需启动；HTTP 需显式启用并配置允许的 Host。
      - MCP_HTTP_HOST=${MCP_HTTP_HOST:-127.0.0.1}
      - MCP_HTTP_PORT=${MCP_HTTP_PORT:-1315}
      # PWA Web Push（先运行 go run ./cmd/vapid-keygen 生成一对长期密钥）
      #- WEB_PUSH_VAPID_PUBLIC_KEY=
      # fnOS/Portainer 等图形面板可直接填写私钥；使用时不要再设置 PRIVATE_KEY_FILE。
      #- WEB_PUSH_VAPID_PRIVATE_KEY=
      #- WEB_PUSH_VAPID_PRIVATE_KEY_FILE=/run/secrets/echo-noise-vapid-private-key
      # 可使用 mailto:owner@example.com；不想提供邮箱时可填写站点的公开 HTTPS 地址。
      #- WEB_PUSH_VAPID_SUBJECT=https://example.com/
      # 如启用外部数据库，取消注释并配置
      #- DB_TYPE=postgres
      #- DB_HOST=postgres
      #- DB_PORT=5432
      #- DB_USER=postgres
      #- DB_PASSWORD=
      #- DB_NAME=noise
      #- DB_TYPE=mysql
      #- DB_HOST=mysql
      #- DB_PORT=3306
      #- DB_USER=
      #- DB_PASSWORD=
      #- DB_NAME=
      # 如需远程 MCP HTTP，请按 mcp/README.md 配置监听、反代及客户端凭据。
    ports:
      - "1314:1314"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped


